name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Intelligence support needs the macOS 27 SDK to compile, so this needs Xcode 27 or later.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test
      - name: Build the app
        run: SIGN_IDENTITY=- scripts/build-app.sh
